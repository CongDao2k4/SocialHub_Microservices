name: CI/CD SocialHub Microservices - Oracle VM

on:
  push:
    branches:
      - feature/oracle_deploy

permissions:
  contents: read
  packages: write

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1: BUILD & PUSH DOCKER IMAGES TO GHCR (Chạy song song)
  # ─────────────────────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: gateway
            context: ./gateway
          - service: user-service
            context: ./services/user-service
          - service: friend-service
            context: ./services/friend-service
          - service: post-service
            context: ./services/post-service
          - service: chat-service
            context: ./services/chat-service
          - service: media-service
            context: ./services/media-service
          - service: notification-service
            context: ./services/notification-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Lowercase Image Name
        id: prep
        run: |
          # Convert owner/repo names to lowercase as GHCR requires lowercase tags
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_name=ghcr.io/${OWNER_LOWER}/socialhub-${{ matrix.service }}" >> $GITHUB_OUTPUT

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          push: true
          tags: |
            ${{ steps.prep.outputs.image_name }}:latest
            ${{ steps.prep.outputs.image_name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2: REMOTE DEPLOY OVER SSH TO ORACLE CLOUD VM
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Oracle VM
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Executing remote SSH commands to deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            echo "=== 1. DI CHUYỂN VÀO THƯ MỤC DỰ ÁN ==="
            cd ~/SocialHub_Microservices || exit 1

            echo "=== 2. CẬP NHẬT MÃ NGUỒN (LẤY DOCKER-COMPOSE.PROD.YML MỚI) ==="
            git fetch origin feature/oracle_deploy
            git checkout feature/oracle_deploy
            git pull origin feature/oracle_deploy

            echo "=== 3. ĐĂNG NHẬP VÀO GHCR TRÊN VM ==="
            # Sử dụng GitHub Token / Personal Access Token được chuyển tiếp hoặc login qua SSH key nếu cần
            # Để đơn giản, các public/private packages trên GHCR có thể được kéo công khai nếu repo là public, 
            # hoặc ta sử dụng thông tin đăng nhập được cấu hình sẵn trên VM.
            # Ta cũng có thể pass token từ workflow sang:
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "=== 4. PULL DOCKER IMAGES MỚI NHẤT ==="
            docker compose -f docker-compose.prod.yml pull

            echo "=== 5. KHỞI CHẠY LẠI CÁC DỊCH VỤ VỚI ẢNH MỚI ==="
            docker compose -f docker-compose.prod.yml up -d

            echo "=== 6. DỌN DẸP ẢNH DOCKER CŨ (DÙNG ĐỂ TIẾT KIỆM BỘ NHỚ VM) ==="
            docker image prune -f

            echo "=== CD HOÀN THÀNH THÀNH CÔNG! ==="
