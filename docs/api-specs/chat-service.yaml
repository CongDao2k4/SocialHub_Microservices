openapi: 3.0.3

info:
  title: chat-service
  version: 1.1.0
  description: |
    Chat service for SocialHub.

    Covers:
    - 1-1 conversations
    - group chat
    - message history
    - typing and presence
    - WebRTC signaling for audio/video call
    - ICE server discovery for STUN/TURN

servers:
  - url: http://localhost:5004
    description: Direct local access
  - url: http://localhost:8080/api
    description: Access through Gateway

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /conversations:
    get:
      tags: [Conversations]
      summary: List conversations
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Conversation list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversations'

    post:
      tags: [Conversations]
      summary: Create or reuse a direct conversation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [participantId]
              properties:
                participantId:
                  type: string
                  description: Target user ID
      responses:
        '200':
          description: Existing conversation returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '400':
          description: Invalid payload

  /conversations/ice-servers:
    get:
      tags: [WebRTC]
      summary: Get ICE server configuration
      security:
        - bearerAuth: []
      description: |
        Returns the STUN/TURN configuration used by frontend WebRTC call flow.

        Current implementation returns:
        - Google public STUN servers
        - TURN server from backend environment variables:
          - TURN_URL
          - TURN_USERNAME
          - TURN_CREDENTIAL
      responses:
        '200':
          description: ICE servers returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IceServerResponse'

  /conversations/{id}:
    get:
      tags: [Conversations]
      summary: Get conversation by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversation found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          description: Conversation not found

    delete:
      tags: [Conversations]
      summary: Delete conversation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Conversation deleted

  /conversations/{id}/messages:
    get:
      tags: [Conversations]
      summary: Get message history
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: before
          schema:
            type: string
          description: Cursor message ID
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Message history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageHistory'
        '403':
          description: User is not a participant

  /groups:
    post:
      tags: [Groups]
      summary: Create group
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateGroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChat'

  /groups/{id}:
    get:
      tags: [Groups]
      summary: Get group detail
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Group detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupChat'
    put:
      tags: [Groups]
      summary: Update group
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                avatarUrl:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Group updated

  /groups/{id}/members:
    post:
      tags: [Groups]
      summary: Add member to group
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  type: string
      responses:
        '200':
          description: Member added

  /groups/{id}/members/{userId}:
    delete:
      tags: [Groups]
      summary: Remove member from group
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: userId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member removed

  /groups/{id}/leave:
    post:
      tags: [Groups]
      summary: Leave group
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Left group

x-socketio-events:
  enabled: true
  namespace: /
  authentication: JWT in handshake auth object

  client-to-server:
    - event: message:send
      description: Send a new message
    - event: message:read
      description: Mark messages as read
    - event: typing:start
      description: Start typing
    - event: typing:stop
      description: Stop typing
    - event: presence:heartbeat
      description: Refresh online presence TTL

  server-to-client:
    - event: message:received
      description: New message broadcast
    - event: message:read:ack
      description: Read acknowledgement
    - event: typing:indicator
      description: Typing indicator for other participants
    - event: user:online
      description: User came online
    - event: user:offline
      description: User went offline

  call-signaling-client-to-server:
    - event: call:initiate
      description: |
        Initiate 1-1 or group call.

        Supported payloads:
        - 1-1: `targetUserId`, `callerName`, `callerAvatar`, `callType`
        - group: `targetUserIds[]`, `groupId`, `groupName`, `groupAvatar`, `callType`
    - event: call:accept
      description: Accept incoming call
    - event: call:reject
      description: Reject incoming call
    - event: call:end
      description: End active call
    - event: webrtc:offer
      description: Forward SDP offer
    - event: webrtc:answer
      description: Forward SDP answer
    - event: webrtc:ice-candidate
      description: Forward ICE candidate
    - event: group-call:join
      description: Join group call room
    - event: group-call:leave
      description: Leave group call room

  call-signaling-server-to-client:
    - event: call:incoming
      description: Incoming 1-1 or group call
    - event: call:accepted
      description: Call accepted
    - event: call:rejected
      description: Call rejected or target unavailable
    - event: call:ended
      description: Call ended
    - event: webrtc:offer
      description: Forwarded SDP offer
    - event: webrtc:answer
      description: Forwarded SDP answer
    - event: webrtc:ice-candidate
      description: Forwarded ICE candidate
    - event: group-call:joined-room
      description: Existing participants list when joining group call room
    - event: group-call:user-joined
      description: Another user joined group call room
    - event: group-call:user-left
      description: Another user left group call room

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    IceServerResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            iceServers:
              type: array
              items:
                type: object
                properties:
                  urls:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                  username:
                    type: string
                    nullable: true
                  credential:
                    type: string
                    nullable: true

    Conversation:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum: [direct, group]
        participants:
          type: array
          items:
            $ref: '#/components/schemas/Participant'
        lastMessage:
          $ref: '#/components/schemas/MessagePreview'
          nullable: true
        unreadCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Participant:
      type: object
      properties:
        userId:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
          nullable: true
        isOnline:
          type: boolean

    MessagePreview:
      type: object
      properties:
        content:
          type: string
        senderId:
          type: string
        senderName:
          type: string
        createdAt:
          type: string
          format: date-time

    Message:
      type: object
      properties:
        id:
          type: string
        conversationId:
          type: string
        senderId:
          type: string
        senderName:
          type: string
        senderAvatar:
          type: string
          nullable: true
        content:
          type: string
        type:
          type: string
          enum: [text, image]
        mediaUrl:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    MessageHistory:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Message'
        hasMore:
          type: boolean
        nextCursor:
          type: string
          nullable: true

    CreateGroupRequest:
      type: object
      required: [name, memberIds]
      properties:
        name:
          type: string
        memberIds:
          type: array
          items:
            type: string
          minItems: 1
        avatarUrl:
          type: string
          nullable: true

    GroupChat:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        avatarUrl:
          type: string
          nullable: true
        members:
          type: array
          items:
            type: object
        memberCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    PaginatedConversations:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Conversation'
        pagination:
          type: object
          properties:
            page:
              type: integer
            limit:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
