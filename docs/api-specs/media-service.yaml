openapi: 3.0.3

info:
  title: media-service
  version: 1.1.0
  description: |
    Media service for SocialHub.

    Covers:
    - image upload and image variants
    - video upload
    - synchronous HLS generation for new video uploads
    - public file stream and public HLS stream through Gateway
    - metadata and delete operations

servers:
  - url: http://localhost:5005
    description: Direct local access
  - url: http://localhost:8080/api
    description: Access through Gateway

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      responses:
        '200':
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /media/upload:
    post:
      tags: [Media]
      summary: Upload image or video
      security:
        - bearerAuth: []
      description: |
        Uploads an image or video.

        Image flow:
        - uploads to MinIO
        - may generate WebP variants: original, medium, thumbnail

        Video flow:
        - uploads original file to MinIO
        - transcodes to HLS using FFmpeg
        - uploads `index.m3u8` and `.ts` segments
        - only returns `201` after `hlsReady=true`

        This means a newly uploaded reel video is ready for HLS playback as soon as upload succeeds.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Upload completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaUploadResponse'
        '400':
          description: Invalid file or payload
        '401':
          description: Unauthorized
        '413':
          description: File too large
        '500':
          description: Upload or HLS processing failed

  /media/batch-urls:
    post:
      tags: [Media]
      summary: Get proxy URLs for multiple media IDs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mediaIds]
              properties:
                mediaIds:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: URL batch returned

  /media/{id}:
    get:
      tags: [Media]
      summary: Get media metadata
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Media metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaInfo'
        '404':
          description: Media not found

    delete:
      tags: [Media]
      summary: Delete media
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Media deleted
        '403':
          description: Only owner can delete
        '404':
          description: Media not found

  /media/file/{id}:
    get:
      tags: [Media]
      summary: Stream file or fallback raw media
      description: |
        Public binary stream endpoint.

        For images:
        - supports `variant=thumbnail|medium|original`

        For video:
        - returns the original uploaded file
        - often used as fallback MP4/raw stream when HLS is not used on client
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: query
          name: variant
          schema:
            type: string
            enum: [thumbnail, medium, original]
            default: medium
      responses:
        '200':
          description: Binary stream
          headers:
            Cache-Control:
              schema:
                type: string
                example: public, max-age=31536000, immutable
            ETag:
              schema:
                type: string
                example: '"mediaId-medium"'
        '404':
          description: Media not found

  /media/hls/{id}/index.m3u8:
    get:
      tags: [HLS]
      summary: Stream HLS playlist
      description: |
        Public HLS playlist endpoint for video playback.

        For newly uploaded videos, playlist should already be ready when upload succeeds.
        For legacy videos without HLS, service may trigger HLS generation on demand.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: HLS playlist stream
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string
                format: binary
        '404':
          description: Playlist not found or not ready

  /media/hls/{id}/{segment}:
    get:
      tags: [HLS]
      summary: Stream HLS segment
      description: Public HLS segment `.ts` stream
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: segment
          required: true
          schema:
            type: string
            example: segment_000.ts
      responses:
        '200':
          description: HLS segment stream
          content:
            video/mp2t:
              schema:
                type: string
                format: binary
        '404':
          description: Segment not found

  /media/{id}/url:
    get:
      tags: [Media]
      summary: Get proxy URL for media
      security:
        - bearerAuth: []
      description: |
        Returns a relative proxy URL, not a direct MinIO presigned URL.

        Current implementation returns:
        - `/media/file/:id`
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Relative proxy URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProxyUrlResponse'
        '404':
          description: Media not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: ok

    MediaUploadResponse:
      type: object
      properties:
        id:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        uploadedBy:
          type: string
        createdAt:
          type: string
          format: date-time
        hlsReady:
          type: boolean

    MediaInfo:
      type: object
      properties:
        _id:
          type: string
        originalName:
          type: string
        mimeType:
          type: string
        size:
          type: integer
        objectKey:
          type: string
        uploadedBy:
          type: string
        compressedSize:
          type: integer
          nullable: true
        compressionRatio:
          type: number
          nullable: true
        format:
          type: string
          nullable: true
        hlsReady:
          type: boolean
        hlsMasterKey:
          type: string
          nullable: true
        variants:
          type: object
          additionalProperties:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProxyUrlResponse:
      type: object
      properties:
        mediaId:
          type: string
        url:
          type: string
          example: /media/file/6a5c6a4f05b6f74886131477
        expiresAt:
          type: string
          format: date-time
        ttlSeconds:
          type: integer
